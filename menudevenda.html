<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Menu de Venda - COC</title>
  <style>
    body{background:#0D1117;color:white;font-family:Arial;text-align:center;padding:30px;}
    h1{color:#16d936;font-size:32px;margin-bottom:10px;}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;max-width:1000px;margin:40px auto;}
    .plano{background:#111;border:2px solid #22ff4f;border-radius:15px;padding:25px;transition:0.3s;}
    .plano:hover{transform:translateY(-5px);box-shadow:0 0 25px rgba(0,255,70,.3);}
    .preco{font-size:35px;color:#00ff88;font-weight:bold;margin:15px 0;}
    .btn{width:100%;padding:15px;background:linear-gradient(135deg,#16b936,#0b6d20);border:none;border-radius:10px;color:white;font-size:18px;font-weight:bold;cursor:pointer;}
    .btn:hover{box-shadow:0 0 20px rgba(0,255,70,.4);}
  </style>
</head>
<body>
  <h1>Escolha seu Plano COC</h1>
  <p>Ative seu bot profissional agora</p>
  
  <div class="grid">
    <div class="plano">
      <h2>BASIC</h2>
      <div class="preco">R$ 19,90</div>
      <p>Bot Simples + Suporte</p>
      <button class="btn" onclick="window.open('https://wa.me/5599984531106?text=Quero o plano BASIC','_blank')">COMPRAR AGORA</button>
    </div>
    
    <div class="plano">
      <h2>PRO 🔥</h2>
      <div class="preco">R$ 39,90</div>
      <p>Bot Avançado + Painel + Suporte 24h</p>
      <button class="btn" onclick="window.open('https://wa.me/5599984531106?text=Quero o plano PRO','_blank')">COMPRAR AGORA</button>
    </div>
    
    <div class="plano">
      <h2>VIP 👑</h2>
      <div class="preco">R$ 69,90</div>
      <p>Tudo do PRO + Personalizado + Prioridade</p>
      <button class="btn" onclick="window.open('https://wa.me/5599984531106?text=Quero o plano VIP','_blank')">COMPRAR AGORA</button>
    </div>
  </div>
  
  <a href="index.html" style="color:#22ff4f;">← Voltar</a>
</body>
</html>
