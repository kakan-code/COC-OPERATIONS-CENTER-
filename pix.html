<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="pix.css"> <!-- LINKA O CSS -->
  <title>Pagamento PIX - COC Backend</title>
</head>
<body>
  <div class="pix-container">
    <h1>Quase lá! 🚀</h1>
    <p>Escaneie o QR Code ou copie a chave PIX</p>
    
    <div class="valor" id="valor">R$ 39,90</div>

    <div class="qr-code">
      <img src="IMG-20260812-WA0019.jpg" alt="QR Code PIX"> <!-- COLOCA SEU QR AQUI -->
    </div>

    <p>Ou copie a chave:</p>
    <div class="chave-pix" id="chavePix">COCPIX@SUA.CHAVE.AQUI</div>
    
    <button class="btn btn-copiar" onclick="copiarChave()">COPIAR CHAVE PIX</button>
    <button class="btn btn-paguei" onclick="window.open('https://wa.me/5599984531106?text=Já paguei o plano','_blank')">JÁ PAGUEI ✅</button>

    <p class="timer">⏰ Esse PIX expira em 30 minutos</p>
    <a href="menudevenda.html" class="voltar">← Voltar</a>
  </div>

  <script>
    function copiarChave() {
      const chave = document.getElementById('chavePix').innerText;
      navigator.clipboard.writeText(chave);
      alert('Chave PIX copiada! ✅');
    }
  </script>
</body>
</html>
